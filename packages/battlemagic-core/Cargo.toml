[package]
name = "battlemagic-core"
version = "0.1.0"
authors = ["ril3y <riley@battlewithbytes.io>"]
edition = "2021"
description = "WebAssembly-powered GDB debugger core for embedded ARM development"
license = "MIT"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
console_error_panic_hook = "0.1"
js-sys = "0.3"

# Binary parsing
goblin = "0.8"

# Disassembly - pure Rust ARM disassembler
yaxpeax-arm = { version = "0.3", default-features = false }
yaxpeax-arch = { version = "0.3", default-features = false }

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Performance",
  "Window",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Better optimization
panic = "abort"     # Remove panic infrastructure
strip = true        # Strip symbols

[profile.dev]
opt-level = 0
debug = true
