<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BattleMagic Analyzer - Browser Test Suite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #4ec9b0;
            margin-bottom: 20px;
            font-size: 2em;
        }

        h2 {
            color: #569cd6;
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .status-bar {
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .status-item {
            display: inline-block;
            margin-right: 30px;
            font-size: 14px;
        }

        .status-label {
            color: #808080;
            margin-right: 8px;
        }

        .status-value {
            color: #4ec9b0;
            font-weight: bold;
        }

        .test-section {
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .test-case {
            background: #1e1e1e;
            border-left: 3px solid #3e3e42;
            padding: 12px;
            margin: 10px 0;
            font-size: 14px;
        }

        .test-case.passed {
            border-left-color: #4ec9b0;
        }

        .test-case.failed {
            border-left-color: #f48771;
        }

        .test-case.running {
            border-left-color: #dcdcaa;
        }

        .test-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .test-result {
            color: #808080;
            font-size: 13px;
        }

        .test-passed {
            color: #4ec9b0;
        }

        .test-failed {
            color: #f48771;
        }

        .test-running {
            color: #dcdcaa;
        }

        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        button:hover {
            background: #1177bb;
        }

        button:disabled {
            background: #3e3e42;
            cursor: not-allowed;
        }

        .controls {
            margin-bottom: 20px;
        }

        .performance-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .metric-card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #3e3e42;
        }

        .metric-label {
            color: #808080;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .metric-value {
            color: #4ec9b0;
            font-size: 24px;
            font-weight: bold;
        }

        .metric-unit {
            color: #808080;
            font-size: 14px;
        }

        pre {
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            padding: 15px;
            overflow-x: auto;
            font-size: 12px;
            line-height: 1.5;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #3e3e42;
            border-radius: 2px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: #4ec9b0;
            transition: width 0.3s ease;
        }

        .error-message {
            background: #3e1e1e;
            border: 1px solid #f48771;
            border-radius: 4px;
            padding: 15px;
            margin: 10px 0;
            color: #f48771;
        }

        .log-output {
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BattleMagic Analyzer - Browser Test Suite</h1>

        <div class="status-bar">
            <div class="status-item">
                <span class="status-label">Status:</span>
                <span class="status-value" id="overall-status">Ready</span>
            </div>
            <div class="status-item">
                <span class="status-label">Tests Run:</span>
                <span class="status-value" id="tests-run">0</span>
            </div>
            <div class="status-item">
                <span class="status-label">Passed:</span>
                <span class="status-value" style="color: #4ec9b0;" id="tests-passed">0</span>
            </div>
            <div class="status-item">
                <span class="status-label">Failed:</span>
                <span class="status-value" style="color: #f48771;" id="tests-failed">0</span>
            </div>
            <div class="status-item">
                <span class="status-label">Pass Rate:</span>
                <span class="status-value" id="pass-rate">0%</span>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
        </div>

        <div class="controls">
            <button id="run-all" onclick="runAllTests()">Run All Tests</button>
            <button id="run-unit" onclick="runUnitTests()">Run Unit Tests Only</button>
            <button id="run-integration" onclick="runIntegrationTests()">Run Integration Tests Only</button>
            <button id="clear-results" onclick="clearResults()">Clear Results</button>
        </div>

        <div class="test-section">
            <h2>Unit Tests</h2>
            <div id="unit-tests"></div>
        </div>

        <div class="test-section">
            <h2>Integration Tests</h2>
            <div id="integration-tests"></div>
        </div>

        <div class="test-section">
            <h2>Performance Metrics</h2>
            <div class="performance-metrics" id="performance-metrics">
                <div class="metric-card">
                    <div class="metric-label">WASM Load Time</div>
                    <div class="metric-value" id="load-time">-</div>
                    <div class="metric-unit">ms</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Avg Analysis Time</div>
                    <div class="metric-value" id="avg-analysis-time">-</div>
                    <div class="metric-unit">ms</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Total Xrefs Analyzed</div>
                    <div class="metric-value" id="total-xrefs">0</div>
                    <div class="metric-unit">xrefs</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Instructions/sec</div>
                    <div class="metric-value" id="instructions-per-sec">-</div>
                    <div class="metric-unit">ops/s</div>
                </div>
            </div>
        </div>

        <div class="test-section">
            <h2>Test Log</h2>
            <div class="log-output" id="log-output"></div>
        </div>
    </div>

    <script type="module">
        import init, { BinaryAnalyzer } from './pkg/battlemagic_analyzer.js';

        let wasmModule;
        let testsRun = 0;
        let testsPassed = 0;
        let testsFailed = 0;
        let analysisTimes = [];

        async function loadWasm() {
            const startTime = performance.now();
            await init();
            const endTime = performance.now();
            const loadTime = (endTime - startTime).toFixed(2);

            document.getElementById('load-time').textContent = loadTime;
            log(`WASM module loaded in ${loadTime}ms`, 'success');
            return true;
        }

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log-output');
            const entry = document.createElement('div');
            entry.style.padding = '5px';
            entry.style.marginBottom = '3px';

            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'success' ? '#4ec9b0' : type === 'error' ? '#f48771' : '#d4d4d4';

            entry.innerHTML = `<span style="color: #808080;">[${timestamp}]</span> <span style="color: ${color};">${message}</span>`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function createTestElement(testName, container) {
            const testDiv = document.createElement('div');
            testDiv.className = 'test-case running';
            testDiv.innerHTML = `
                <div class="test-name">${testName}</div>
                <div class="test-result test-running">Running...</div>
            `;
            document.getElementById(container).appendChild(testDiv);
            return testDiv;
        }

        function updateTestResult(testDiv, passed, message) {
            testsRun++;
            if (passed) {
                testsPassed++;
                testDiv.className = 'test-case passed';
                testDiv.querySelector('.test-result').className = 'test-result test-passed';
                testDiv.querySelector('.test-result').textContent = `✓ ${message}`;
            } else {
                testsFailed++;
                testDiv.className = 'test-case failed';
                testDiv.querySelector('.test-result').className = 'test-result test-failed';
                testDiv.querySelector('.test-result').textContent = `✗ ${message}`;
            }
            updateStatusBar();
        }

        function updateStatusBar() {
            document.getElementById('tests-run').textContent = testsRun;
            document.getElementById('tests-passed').textContent = testsPassed;
            document.getElementById('tests-failed').textContent = testsFailed;

            const passRate = testsRun > 0 ? ((testsPassed / testsRun) * 100).toFixed(1) : 0;
            document.getElementById('pass-rate').textContent = `${passRate}%`;

            const progress = testsRun > 0 ? (testsRun / 25) * 100 : 0; // Assuming ~25 total tests
            document.getElementById('progress-fill').style.width = `${Math.min(progress, 100)}%`;

            if (testsFailed === 0 && testsRun > 0) {
                document.getElementById('overall-status').textContent = 'All Passed';
                document.getElementById('overall-status').style.color = '#4ec9b0';
            } else if (testsFailed > 0) {
                document.getElementById('overall-status').textContent = 'Failed';
                document.getElementById('overall-status').style.color = '#f48771';
            }
        }

        window.runUnitTests = async function() {
            log('Starting unit tests...', 'info');

            // Test 1: Analyzer Creation
            let testDiv = createTestElement('Analyzer Creation', 'unit-tests');
            try {
                const analyzer = new BinaryAnalyzer(0x8000);
                const isCreated = analyzer !== null && !analyzer.is_analyzed();
                updateTestResult(testDiv, isCreated, 'Analyzer created successfully');
            } catch (error) {
                updateTestResult(testDiv, false, `Error: ${error.message}`);
            }

            // Test 2: Simple Analysis
            testDiv = createTestElement('Simple ARM Analysis', 'unit-tests');
            try {
                const analyzer = new BinaryAnalyzer(0x8000);
                const disasm = [
                    { address: 0x8000, bytes: [0, 0, 0, 0], mnemonic: 'bl', operands: '#0x9000' },
                    { address: 0x8004, bytes: [0, 0, 0, 0], mnemonic: 'b.eq', operands: '#0x9004' },
                ];
                const results = analyzer.analyze_from_disasm(disasm);
                analysisTimes.push(results.analysis_time_ms);
                updateTestResult(testDiv, results.xrefs.length === 2, `Found ${results.xrefs.length} xrefs (expected 2)`);
            } catch (error) {
                updateTestResult(testDiv, false, `Error: ${error.message}`);
            }

            // Test 3: Branch Detection
            testDiv = createTestElement('Branch Detection', 'unit-tests');
            try {
                const analyzer = new BinaryAnalyzer(0x1000);
                const disasm = [
                    { address: 0x1000, bytes: [0, 0, 0, 0], mnemonic: 'b', operands: '#0x2000' },
                    { address: 0x1004, bytes: [0, 0, 0, 0], mnemonic: 'b.eq', operands: '#0x2004' },
                    { address: 0x1008, bytes: [0, 0, 0, 0], mnemonic: 'b.ne', operands: '#0x2008' },
                    { address: 0x100c, bytes: [0, 0, 0, 0], mnemonic: 'bic', operands: 'r0, r1' },
                ];
                const results = analyzer.analyze_from_disasm(disasm);
                updateTestResult(testDiv, results.xrefs.length === 3, `Detected ${results.xrefs.length} branches (expected 3, excluded bic)`);
            } catch (error) {
                updateTestResult(testDiv, false, `Error: ${error.message}`);
            }

            // Test 4: Call Detection
            testDiv = createTestElement('Function Call Detection', 'unit-tests');
            try {
                const analyzer = new BinaryAnalyzer(0x1000);
                const disasm = [
                    { address: 0x1000, bytes: [0, 0, 0, 0], mnemonic: 'bl', operands: '#0x2000' },
                    { address: 0x1004, bytes: [0, 0, 0, 0], mnemonic: 'blx', operands: '#0x2100' },
                ];
                const results = analyzer.analyze_from_disasm(disasm);
                const calls = results.xrefs.filter(x => x.xref_type === 'Call');
                updateTestResult(testDiv, calls.length === 2, `Found ${calls.length} calls (expected 2)`);
            } catch (error) {
                updateTestResult(testDiv, false, `Error: ${error.message}`);
            }

            // Test 5: Data Reference Detection
            testDiv = createTestElement('PC-Relative Data References', 'unit-tests');
            try {
                const analyzer = new BinaryAnalyzer(0x1000);
                const disasm = [
                    { address: 0x1000, bytes: [0, 0, 0, 0], mnemonic: 'ldr', operands: 'r0, [pc, #0x10]' },
                    { address: 0x1004, bytes: [0, 0, 0, 0], mnemonic: 'str', operands: 'r1, [pc, #0x20]' },
                    { address: 0x1008, bytes: [0, 0, 0, 0], mnemonic: 'ldr', operands: 'r2, [r3, #0x4]' },
                ];
                const results = analyzer.analyze_from_disasm(disasm);
                updateTestResult(testDiv, results.xrefs.length === 2, `Found ${results.xrefs.length} PC-relative refs (expected 2)`);
            } catch (error) {
                updateTestResult(testDiv, false, `Error: ${error.message}`);
            }

            // Test 6: PC Calculation
            testDiv = createTestElement('PC-Relative Address Calculation', 'unit-tests');
            try {
                const analyzer = new BinaryAnalyzer(0x1000);
                const disasm = [
                    { address: 0x1000, bytes: [0, 0, 0, 0], mnemonic: 'ldr', operands: 'r0, [pc, #0x100]' },
                ];
                const results = analyzer.analyze_from_disasm(disasm);
                const expected = 0x1108; // 0x1000 + 8 + 0x100
                updateTestResult(testDiv, results.xrefs[0].to_addr === expected,
                    `Target: 0x${results.xrefs[0].to_addr.toString(16)} (expected: 0x${expected.toString(16)})`);
            } catch (error) {
                updateTestResult(testDiv, false, `Error: ${error.message}`);
            }

            // Test 7: Empty Input
            testDiv = createTestElement('Empty Input Handling', 'unit-tests');
            try {
                const analyzer = new BinaryAnalyzer(0x8000);
                const results = analyzer.analyze_from_disasm([]);
                updateTestResult(testDiv, results.xrefs.length === 0, 'Correctly handled empty input');
            } catch (error) {
                updateTestResult(testDiv, false, `Error: ${error.message}`);
            }

            // Test 8: Invalid Addresses
            testDiv = createTestElement('Invalid Address Handling', 'unit-tests');
            try {
                const analyzer = new BinaryAnalyzer(0x1000);
                const disasm = [
                    { address: 0x1000, bytes: [0, 0, 0, 0], mnemonic: 'bl', operands: 'invalid' },
                    { address: 0x1004, bytes: [0, 0, 0, 0], mnemonic: 'b', operands: '#' },
                ];
                const results = analyzer.analyze_from_disasm(disasm);
                updateTestResult(testDiv, results.xrefs.length === 0, 'Gracefully handled invalid addresses');
            } catch (error) {
                updateTestResult(testDiv, false, `Error: ${error.message}`);
            }

            // Test 9: Xref Queries
            testDiv = createTestElement('Cross-Reference Queries', 'unit-tests');
            try {
                const analyzer = new BinaryAnalyzer(0x1000);
                const disasm = [
                    { address: 0x1000, bytes: [0, 0, 0, 0], mnemonic: 'bl', operands: '#0x2000' },
                    { address: 0x1010, bytes: [0, 0, 0, 0], mnemonic: 'bl', operands: '#0x2000' },
                ];
                analyzer.analyze_from_disasm(disasm);
                const xrefsTo = analyzer.get_xrefs_to(0x2000);
                updateTestResult(testDiv, xrefsTo.count === 2, `Found ${xrefsTo.count} xrefs to 0x2000 (expected 2)`);
            } catch (error) {
                updateTestResult(testDiv, false, `Error: ${error.message}`);
            }

            // Test 10: Analyzer Reset
            testDiv = createTestElement('Analyzer Reset', 'unit-tests');
            try {
                const analyzer = new BinaryAnalyzer(0x1000);
                const disasm = [{ address: 0x1000, bytes: [0, 0, 0, 0], mnemonic: 'bl', operands: '#0x2000' }];
                analyzer.analyze_from_disasm(disasm);
                analyzer.reset();
                const isReset = !analyzer.is_analyzed() && analyzer.xref_count() === 0;
                updateTestResult(testDiv, isReset, 'Analyzer reset successfully');
            } catch (error) {
                updateTestResult(testDiv, false, `Error: ${error.message}`);
            }

            log('Unit tests completed', 'success');
        };

        window.runIntegrationTests = async function() {
            log('Starting integration tests...', 'info');

            // Test 1: Complex Function
            let testDiv = createTestElement('Complete Function Analysis', 'integration-tests');
            try {
                const analyzer = new BinaryAnalyzer(0x8000);
                const disasm = [
                    { address: 0x8000, bytes: [0, 0, 0, 0], mnemonic: 'push', operands: '{r4-r7, lr}' },
                    { address: 0x8008, bytes: [0, 0, 0, 0], mnemonic: 'ldr', operands: 'r0, [pc, #0x20]' },
                    { address: 0x800c, bytes: [0, 0, 0, 0], mnemonic: 'bl', operands: '#0x9000' },
                    { address: 0x8014, bytes: [0, 0, 0, 0], mnemonic: 'b.eq', operands: '#0x8030' },
                    { address: 0x8018, bytes: [0, 0, 0, 0], mnemonic: 'bl', operands: '#0x9100' },
                ];
                const results = analyzer.analyze_from_disasm(disasm);
                updateTestResult(testDiv, results.xrefs.length === 4, `Found ${results.xrefs.length} xrefs in complex function`);
            } catch (error) {
                updateTestResult(testDiv, false, `Error: ${error.message}`);
            }

            // Test 2: Multiple Functions with Calls
            testDiv = createTestElement('Multiple Function Call Chain', 'integration-tests');
            try {
                const analyzer = new BinaryAnalyzer(0x1000);
                const disasm = [
                    { address: 0x1004, bytes: [0, 0, 0, 0], mnemonic: 'bl', operands: '#0x2000' },
                    { address: 0x1008, bytes: [0, 0, 0, 0], mnemonic: 'bl', operands: '#0x3000' },
                    { address: 0x2004, bytes: [0, 0, 0, 0], mnemonic: 'bl', operands: '#0x3000' },
                ];
                const results = analyzer.analyze_from_disasm(disasm);
                const xrefsToFunc3 = analyzer.get_xrefs_to(0x3000);
                updateTestResult(testDiv, xrefsToFunc3.count === 2, `Function called from ${xrefsToFunc3.count} places (expected 2)`);
            } catch (error) {
                updateTestResult(testDiv, false, `Error: ${error.message}`);
            }

            // Test 3: Loop Pattern
            testDiv = createTestElement('Loop Pattern Detection', 'integration-tests');
            try {
                const analyzer = new BinaryAnalyzer(0x1000);
                const disasm = [
                    { address: 0x1004, bytes: [0, 0, 0, 0], mnemonic: 'cmp', operands: 'r4, #10' },
                    { address: 0x1008, bytes: [0, 0, 0, 0], mnemonic: 'b.ge', operands: '#0x1020' },
                    { address: 0x1018, bytes: [0, 0, 0, 0], mnemonic: 'b', operands: '#0x1004' },
                ];
                const results = analyzer.analyze_from_disasm(disasm);
                const backwardBranch = results.xrefs.find(x => x.from_addr > x.to_addr);
                updateTestResult(testDiv, backwardBranch !== undefined, 'Detected backward branch (loop)');
            } catch (error) {
                updateTestResult(testDiv, false, `Error: ${error.message}`);
            }

            // Test 4: Large Binary Stress Test
            testDiv = createTestElement('Large Binary (10k instructions)', 'integration-tests');
            try {
                const analyzer = new BinaryAnalyzer(0x8000);
                const disasm = [];
                for (let i = 0; i < 10000; i++) {
                    disasm.push({
                        address: 0x8000 + (i * 4),
                        bytes: [0, 0, 0, 0],
                        mnemonic: 'bl',
                        operands: `#0x${(0x10000 + i * 4).toString(16)}`
                    });
                }
                const startTime = performance.now();
                const results = analyzer.analyze_from_disasm(disasm);
                const endTime = performance.now();
                analysisTimes.push(results.analysis_time_ms);

                document.getElementById('total-xrefs').textContent =
                    (parseInt(document.getElementById('total-xrefs').textContent) + results.xrefs.length).toString();

                const wallTime = (endTime - startTime).toFixed(2);
                updateTestResult(testDiv, results.xrefs.length === 10000,
                    `Analyzed 10k instructions in ${wallTime}ms (WASM: ${results.analysis_time_ms}ms)`);
            } catch (error) {
                updateTestResult(testDiv, false, `Error: ${error.message}`);
            }

            // Test 5: Recursive Function
            testDiv = createTestElement('Recursive Function Detection', 'integration-tests');
            try {
                const analyzer = new BinaryAnalyzer(0x1000);
                const disasm = [
                    { address: 0x1014, bytes: [0, 0, 0, 0], mnemonic: 'bl', operands: '#0x1000' },
                ];
                const results = analyzer.analyze_from_disasm(disasm);
                const xrefsToStart = analyzer.get_xrefs_to(0x1000);
                updateTestResult(testDiv, xrefsToStart.count === 1, 'Detected recursive call');
            } catch (error) {
                updateTestResult(testDiv, false, `Error: ${error.message}`);
            }

            // Update performance metrics
            if (analysisTimes.length > 0) {
                const avgTime = (analysisTimes.reduce((a, b) => a + b, 0) / analysisTimes.length).toFixed(2);
                document.getElementById('avg-analysis-time').textContent = avgTime;

                // Calculate instructions per second (rough estimate)
                const totalInstructions = 10000; // From large binary test
                const timeInSeconds = analysisTimes[analysisTimes.length - 1] / 1000;
                const opsPerSec = (totalInstructions / timeInSeconds).toFixed(0);
                document.getElementById('instructions-per-sec').textContent = opsPerSec.toLocaleString();
            }

            log('Integration tests completed', 'success');
        };

        window.runAllTests = async function() {
            clearResults();
            log('Starting all tests...', 'info');
            document.getElementById('overall-status').textContent = 'Running...';
            document.getElementById('overall-status').style.color = '#dcdcaa';

            await runUnitTests();
            await runIntegrationTests();

            log('All tests completed!', 'success');
        };

        window.clearResults = function() {
            testsRun = 0;
            testsPassed = 0;
            testsFailed = 0;
            analysisTimes = [];

            document.getElementById('unit-tests').innerHTML = '';
            document.getElementById('integration-tests').innerHTML = '';
            document.getElementById('log-output').innerHTML = '';
            document.getElementById('overall-status').textContent = 'Ready';
            document.getElementById('overall-status').style.color = '#4ec9b0';
            document.getElementById('progress-fill').style.width = '0%';

            updateStatusBar();
        };

        // Initialize
        (async () => {
            try {
                await loadWasm();
                log('Ready to run tests!', 'success');
            } catch (error) {
                log(`Failed to load WASM: ${error.message}`, 'error');
                document.getElementById('overall-status').textContent = 'Load Failed';
                document.getElementById('overall-status').style.color = '#f48771';
            }
        })();
    </script>
</body>
</html>
