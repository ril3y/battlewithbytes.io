<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TinyCC WASM - ARM Cross Compiler | BattleWithBytes</title>
    <style>
        :root {
            --background: #0a0a0a;
            --foreground: #ededed;
            --accent-primary: #00ff9d;
            --accent-secondary: #0088ff;
            --accent-purple: #c084fc;
            --grid-color: rgba(0, 255, 157, 0.05);
            --font-mono: 'Courier New', Consolas, Monaco, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--background);
            color: var(--foreground);
            background-image:
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 30px 30px;
            min-height: 100vh;
            padding: 20px;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #111111;
        }

        ::-webkit-scrollbar-thumb {
            background: #333333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-primary);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: var(--accent-primary);
            text-shadow: 0 0 20px rgba(0, 255, 157, 0.5);
        }

        h2 {
            color: var(--accent-secondary);
            margin-bottom: 15px;
            font-size: 1.3em;
            font-family: var(--font-mono);
        }

        .status {
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 157, 0.2);
            border-radius: 6px;
            margin: 20px 0;
            font-family: var(--font-mono);
            font-size: 14px;
        }

        .status strong {
            color: var(--accent-primary);
        }

        .status.loading {
            border-left: 4px solid var(--accent-secondary);
        }

        .status.success {
            border-left: 4px solid #10b981;
        }

        .status.error {
            border-left: 4px solid #ef4444;
        }

        .status.warning {
            border-left: 4px solid #f59e0b;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 1024px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 157, 0.2);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 16px rgba(0, 255, 157, 0.15);
        }

        textarea {
            width: 100%;
            height: 350px;
            background: #0a0a0a;
            color: var(--foreground);
            border: 1px solid rgba(0, 255, 157, 0.3);
            padding: 15px;
            font-family: var(--font-mono);
            font-size: 14px;
            resize: vertical;
            border-radius: 4px;
            line-height: 1.5;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 10px rgba(0, 255, 157, 0.3);
        }

        button {
            background: transparent;
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            padding: 10px 20px;
            margin: 10px 5px 10px 0;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            font-family: var(--font-mono);
            font-weight: bold;
            transition: all 0.2s ease;
        }

        button:hover:not(:disabled) {
            background: var(--accent-primary);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.5);
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.secondary {
            border-color: var(--accent-secondary);
            color: var(--accent-secondary);
        }

        button.secondary:hover:not(:disabled) {
            background: var(--accent-secondary);
            box-shadow: 0 0 15px rgba(0, 136, 255, 0.5);
        }

        .output {
            background: #0a0a0a;
            color: var(--foreground);
            padding: 15px;
            border: 1px solid rgba(0, 255, 157, 0.3);
            border-radius: 4px;
            min-height: 350px;
            max-height: 600px;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 12px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .output .success {
            color: #10b981;
        }

        .output .error {
            color: #ef4444;
        }

        .output .info {
            color: var(--accent-secondary);
        }

        .output .warning {
            color: #f59e0b;
        }

        .full-width-panel {
            grid-column: 1 / -1;
        }

        code {
            background: #1a1a1a;
            padding: 2px 6px;
            border-radius: 3px;
            color: var(--accent-primary);
        }

        .hex-dump {
            font-size: 11px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 TinyCC WebAssembly - ARM Cross Compiler Test</h1>

        <div class="status loading" id="status">
            <strong>Status:</strong> <span id="statusText">Initializing...</span>
        </div>

        <div class="grid-container">
            <div class="panel">
                <h2>C Source Code</h2>
                <textarea id="sourceCode">// Minimal ARM Cortex-M example
#define GPIOC_ODR (*(volatile unsigned int*)0x4001100C)

void delay(int count) {
    for(int i = 0; i < count; i++);
}

void main(void) {
    while(1) {
        GPIOC_ODR ^= (1 << 13);
        delay(100000);
    }
}</textarea>
                <div>
                    <button id="compileBtn" onclick="compileCode()" disabled>Compile to ARM</button>
                    <button class="secondary" onclick="loadExample('minimal')">Load Minimal</button>
                    <button class="secondary" onclick="loadExample('blink')">Load Blink</button>
                </div>
            </div>

            <div class="panel">
                <h2>Compilation Output</h2>
                <div class="output" id="output">Waiting for compilation...</div>
            </div>

            <div class="panel full-width-panel">
                <h2>ARM Binary Output</h2>
                <div class="output hex-dump" id="binaryOutput">Binary will appear here...</div>
                <div>
                    <button onclick="downloadBinary()" id="downloadBtn" disabled>Download .bin</button>
                    <button onclick="downloadHex()" id="downloadHexBtn" disabled>Download .hex</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let tccModule = null;
        let compiledBinary = null;

        const examples = {
            minimal: `void main(void) {
    volatile int x = 42;
    volatile int y = x + 8;
}`,
            blink: `#define RCC_APB2ENR  (*(volatile unsigned int*)0x40021018)
#define GPIOC_CRH    (*(volatile unsigned int*)0x40011004)
#define GPIOC_ODR    (*(volatile unsigned int*)0x4001100C)

void delay(int count) {
    for(int i = 0; i < count; i++) __asm__("nop");
}

void main(void) {
    RCC_APB2ENR |= (1 << 4);
    GPIOC_CRH &= ~(0xF << 20);
    GPIOC_CRH |= (0x3 << 20);

    while(1) {
        GPIOC_ODR ^= (1 << 13);
        delay(100000);
    }
}`
        };

        function loadExample(name) {
            document.getElementById('sourceCode').value = examples[name];
            log(`Loaded example: ${name}`, 'info');
        }

        function log(message, type = 'info') {
            const output = document.getElementById('output');
            const timestamp = new Date().toLocaleTimeString();
            output.innerHTML += `<span class="${type}">[${timestamp}] ${message}</span>\n`;
            output.scrollTop = output.scrollHeight;
        }

        function updateStatus(text, type = 'loading') {
            const statusEl = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            statusEl.className = `status ${type}`;
            statusText.textContent = text;
        }

        async function initTCC() {
            try {
                updateStatus('Loading TinyCC WASM module...', 'loading');
                log('Initializing TinyCC WebAssembly module...', 'info');

                if (typeof createTCCModule === 'undefined') {
                    throw new Error('TinyCC WASM module not loaded. Run build-tcc.sh first.');
                }

                tccModule = await createTCCModule();

                log('TinyCC module loaded successfully!', 'success');
                updateStatus('Ready', 'success');
                document.getElementById('compileBtn').disabled = false;

            } catch (error) {
                log(`Failed to initialize TinyCC: ${error.message}`, 'error');
                updateStatus('Failed to load - Using mock mode', 'warning');

                log('\n=== FALLBACK: TinyCC not built yet ===', 'warning');
                log('To build TinyCC for WASM:', 'info');
                log('1. Install Emscripten: https://emscripten.org', 'info');
                log('2. Run: cd 1-tinycc && bash build-tcc.sh', 'info');
                log('3. Refresh this page', 'info');
                log('\nFor now, showing mock compilation output...', 'warning');

                window.mockMode = true;
                document.getElementById('compileBtn').disabled = false;
            }
        }

        async function compileCode() {
            const sourceCode = document.getElementById('sourceCode').value;
            const output = document.getElementById('output');
            output.innerHTML = '';

            log('Starting ARM cross-compilation...', 'info');
            log(`Source code length: ${sourceCode.length} bytes`, 'info');

            if (window.mockMode) {
                mockCompile(sourceCode);
                return;
            }

            try {
                const tcc = tccModule.ccall('tcc_new', 'number', [], []);
                if (!tcc) throw new Error('Failed to create TCC state');

                log('TCC state created', 'success');

                tccModule.ccall('tcc_set_output_type', 'number', ['number', 'number'], [tcc, 1]);
                log('Compiling to ARM Thumb code...', 'info');

                const compileResult = tccModule.ccall(
                    'tcc_compile_string',
                    'number',
                    ['number', 'string'],
                    [tcc, sourceCode]
                );

                if (compileResult !== 0) {
                    throw new Error('Compilation failed');
                }

                log('Compilation successful!', 'success');

                const relocSize = tccModule.ccall('tcc_relocate', 'number', ['number', 'number'], [tcc, 0]);
                if (relocSize < 0) throw new Error('Relocation failed');

                log(`Binary size: ${relocSize} bytes`, 'info');

                const binaryPtr = tccModule._malloc(relocSize);
                tccModule.ccall('tcc_relocate', 'number', ['number', 'number'], [tcc, binaryPtr]);

                compiledBinary = new Uint8Array(tccModule.HEAPU8.buffer, binaryPtr, relocSize);
                displayBinary(compiledBinary);

                tccModule._free(binaryPtr);
                tccModule.ccall('tcc_delete', 'void', ['number'], [tcc]);

                log('Compilation complete!', 'success');
                updateStatus('Compilation successful', 'success');

                document.getElementById('downloadBtn').disabled = false;
                document.getElementById('downloadHexBtn').disabled = false;

            } catch (error) {
                log(`Compilation error: ${error.message}`, 'error');
                updateStatus('Compilation failed', 'error');
            }
        }

        function mockCompile(sourceCode) {
            log('=== MOCK COMPILATION MODE ===', 'warning');
            log('This is a simulated compilation for testing purposes', 'warning');
            log('', 'info');

            setTimeout(() => log('Parsing C source...', 'info'), 100);
            setTimeout(() => log('Generating ARM Thumb-2 code...', 'info'), 300);
            setTimeout(() => log('Linking...', 'info'), 500);

            setTimeout(() => {
                compiledBinary = new Uint8Array([
                    0x00, 0xB5,           // PUSH {LR}
                    0x2A, 0x20,           // MOVS R0, #42
                    0x08, 0x30,           // ADDS R0, #8
                    0x00, 0xBD,           // POP {PC}
                ]);

                log('Compilation successful! (MOCK)', 'success');
                log(`Generated ${compiledBinary.length} bytes of ARM code`, 'success');
                displayBinary(compiledBinary);

                document.getElementById('downloadBtn').disabled = false;
                document.getElementById('downloadHexBtn').disabled = false;
                updateStatus('Mock compilation complete', 'success');
            }, 700);
        }

        function displayBinary(binary) {
            const binaryOutput = document.getElementById('binaryOutput');
            let hexDump = 'Offset   Hex                                          ASCII\n';
            hexDump += '================================================================\n';

            for (let i = 0; i < binary.length; i += 16) {
                const offset = i.toString(16).padStart(8, '0');
                let hex = '';
                let ascii = '';

                for (let j = 0; j < 16; j++) {
                    if (i + j < binary.length) {
                        const byte = binary[i + j];
                        hex += byte.toString(16).padStart(2, '0') + ' ';
                        ascii += (byte >= 32 && byte < 127) ? String.fromCharCode(byte) : '.';
                    } else {
                        hex += '   ';
                        ascii += ' ';
                    }
                }

                hexDump += `${offset}  ${hex}  ${ascii}\n`;
            }

            binaryOutput.textContent = hexDump;
            log('Binary output displayed', 'success');
        }

        function downloadBinary() {
            if (!compiledBinary) return;

            const blob = new Blob([compiledBinary], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'firmware.bin';
            a.click();
            URL.revokeObjectURL(url);

            log('Downloaded firmware.bin', 'success');
        }

        function downloadHex() {
            if (!compiledBinary) return;

            const hex = generateIntelHex(compiledBinary, 0x08000000);
            const blob = new Blob([hex], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'firmware.hex';
            a.click();
            URL.revokeObjectURL(url);

            log('Downloaded firmware.hex', 'success');
        }

        function generateIntelHex(binary, baseAddress) {
            let hex = '';
            const BYTES_PER_LINE = 16;

            for (let i = 0; i < binary.length; i += BYTES_PER_LINE) {
                const addr = baseAddress + i;
                const chunk = binary.slice(i, Math.min(i + BYTES_PER_LINE, binary.length));
                const len = chunk.length;

                let line = ':';
                line += len.toString(16).padStart(2, '0').toUpperCase();
                line += ((addr >> 8) & 0xFFFF).toString(16).padStart(4, '0').toUpperCase();
                line += '00';

                let checksum = len + ((addr >> 8) & 0xFF) + (addr & 0xFF);

                for (let j = 0; j < len; j++) {
                    const byte = chunk[j];
                    line += byte.toString(16).padStart(2, '0').toUpperCase();
                    checksum += byte;
                }

                checksum = ((~checksum) + 1) & 0xFF;
                line += checksum.toString(16).padStart(2, '0').toUpperCase();

                hex += line + '\n';
            }

            hex += ':00000001FF\n';
            return hex;
        }

        window.addEventListener('load', initTCC);
    </script>
</body>
</html>
