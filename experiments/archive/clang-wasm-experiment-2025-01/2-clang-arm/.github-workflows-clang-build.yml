name: Build Clang WASM

on:
  push:
    branches: [main, develop]
    paths:
      - 'experiments/c-compiler-poc/2-clang-arm/**'
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-clang:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Clang WASM in Docker
        run: |
          cd experiments/c-compiler-poc/2-clang-arm
          docker-compose up --build

      - name: Check build output
        run: |
          ls -lh experiments/c-compiler-poc/2-clang-arm/dist/

      - name: Upload Clang WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: clang-wasm-arm
          path: |
            experiments/c-compiler-poc/2-clang-arm/dist/clang.wasm.gz
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: experiments/c-compiler-poc/2-clang-arm/dist/clang.wasm.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Deploy to web app
  deploy:
    needs: build-clang
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: clang-wasm-arm
          path: ./compiler

      - name: Deploy to web app
        run: |
          # Copy clang.wasm.gz to web app public directory
          # This step depends on your deployment method
          echo "Deploy clang.wasm.gz to production"
          # Example: aws s3 cp compiler/clang.wasm.gz s3://your-bucket/compiler/
