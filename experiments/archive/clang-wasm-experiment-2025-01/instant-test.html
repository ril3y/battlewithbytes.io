<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Instant WASM Compilation Test | BattleWithBytes</title>
    <style>
        :root {
            --background: #0a0a0a;
            --foreground: #ededed;
            --accent-primary: #00ff9d;
            --accent-secondary: #0088ff;
            --accent-purple: #c084fc;
            --grid-color: rgba(0, 255, 157, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            background: var(--background);
            color: var(--foreground);
            background-image:
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: 0 0;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #111111;
        }

        ::-webkit-scrollbar-thumb {
            background: #333333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-primary);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: var(--accent-primary);
            text-shadow: 0 0 20px rgba(0, 255, 157, 0.5);
        }

        h2 {
            color: var(--accent-secondary);
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .subtitle {
            font-size: 1.2em;
            color: #999;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 157, 0.2);
            border-radius: 8px;
            padding: 30px;
            margin: 20px 0;
            box-shadow: 0 0 16px rgba(0, 255, 157, 0.15);
        }

        .status {
            font-size: 1.1em;
            padding: 15px;
            margin: 15px 0;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.3);
            border-left: 4px solid var(--accent-primary);
        }

        .status.success {
            background: rgba(16, 185, 129, 0.1);
            border-left-color: #10b981;
            color: #10b981;
        }

        .status.error {
            background: rgba(239, 68, 68, 0.1);
            border-left-color: #ef4444;
            color: #ef4444;
        }

        .status.info {
            background: rgba(59, 130, 246, 0.1);
            border-left-color: #3b82f6;
            color: #3b82f6;
        }

        button {
            background: transparent;
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            padding: 12px 24px;
            margin: 10px 10px 10px 0;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        button:hover {
            background: var(--accent-primary);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.5);
            transform: translateY(-2px);
        }

        .test-result {
            margin: 15px 0;
            padding: 15px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.3);
            border-left: 3px solid var(--accent-primary);
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .checkmark {
            color: var(--accent-primary);
            font-size: 1.5em;
            text-shadow: 0 0 10px rgba(0, 255, 157, 0.7);
        }

        .crossmark {
            color: #ef4444;
            font-size: 1.5em;
        }

        #results {
            margin-top: 20px;
        }

        code {
            background: #1a1a1a;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            color: var(--accent-primary);
        }

        ul {
            margin-left: 20px;
            line-height: 1.8;
        }

        ul li {
            margin: 8px 0;
        }

        strong {
            color: var(--accent-primary);
        }
    </style>
</head>
<body>
    <h1>⚡ Instant Browser Compilation Test</h1>
    <p class="subtitle">Proving we can compile code in your browser RIGHT NOW!</p>

    <div class="card">
        <h2>🧪 Test Suite</h2>
        <button onclick="runAllTests()">Run All Tests</button>
        <button onclick="testWasmSupport()">Test 1: WASM Support</button>
        <button onclick="testWasmCompilation()">Test 2: WASM Compilation</button>
        <button onclick="testWasmExecution()">Test 3: Execute Code</button>
        <button onclick="testWebSerial()">Test 4: Web Serial</button>

        <div id="results"></div>
    </div>

    <div class="card">
        <h2>📊 Results Summary</h2>
        <div id="summary" class="status info">
            Click "Run All Tests" to begin...
        </div>
    </div>

    <script>
        const results = document.getElementById('results');
        const summary = document.getElementById('summary');
        let testResults = {
            wasmSupport: false,
            wasmCompilation: false,
            wasmExecution: false,
            webSerial: false
        };

        function addResult(test, passed, message) {
            const icon = passed ? '<span class="checkmark">✓</span>' : '<span class="crossmark">✗</span>';
            const div = document.createElement('div');
            div.className = 'test-result';
            div.innerHTML = `${icon} <strong>${test}:</strong> ${message}`;
            results.appendChild(div);

            testResults[test.replace(/\s+/g, '')] = passed;
            updateSummary();
        }

        function updateSummary() {
            const passed = Object.values(testResults).filter(v => v).length;
            const total = Object.keys(testResults).length;

            if (passed === total) {
                summary.className = 'status success';
                summary.innerHTML = `🎉 All tests passed! (${passed}/${total})<br><br>
                    <strong>✅ Your browser can compile and run code!</strong><br>
                    Ready to build the STM32 compiler.`;
            } else if (passed > 0) {
                summary.className = 'status info';
                summary.innerHTML = `⚠️ ${passed}/${total} tests passed<br>
                    Some features may not be available.`;
            } else {
                summary.className = 'status error';
                summary.innerHTML = `❌ Tests not run yet or browser not compatible.`;
            }
        }

        async function testWasmSupport() {
            results.innerHTML = '';
            try {
                if (typeof WebAssembly === 'undefined') {
                    addResult('WASM Support', false, 'WebAssembly not supported in this browser');
                    return false;
                }

                addResult('WASM Support', true, 'WebAssembly is supported! ✨');

                const caps = [];
                if (WebAssembly.instantiate) caps.push('instantiate');
                if (WebAssembly.instantiateStreaming) caps.push('streaming');
                if (WebAssembly.compileStreaming) caps.push('compile streaming');

                addResult('WASM Capabilities', true, `Supports: ${caps.join(', ')}`);
                return true;
            } catch (error) {
                addResult('WASM Support', false, error.message);
                return false;
            }
        }

        async function testWasmCompilation() {
            try {
                const wasmCode = new Uint8Array([
                    0x00, 0x61, 0x73, 0x6d,  // Magic number '\0asm'
                    0x01, 0x00, 0x00, 0x00,  // Version 1
                    0x01, 0x07, 0x01, 0x60,  // Type section
                    0x02, 0x7f, 0x7f, 0x01, 0x7f,
                    0x03, 0x02, 0x01, 0x00,  // Function section
                    0x07, 0x07, 0x01, 0x03, 0x61, 0x64, 0x64, 0x00, 0x00,
                    0x0a, 0x09, 0x01, 0x07, 0x00, 0x20, 0x00, 0x20, 0x01, 0x6a, 0x0b
                ]);

                const module = await WebAssembly.compile(wasmCode);
                addResult('WASM Compilation', true,
                    `Successfully compiled ${wasmCode.length} bytes of WASM code!`);

                addResult('Compiled Function', true,
                    'Created an "add(a, b)" function in pure WASM bytecode');

                return module;
            } catch (error) {
                addResult('WASM Compilation', false, error.message);
                return null;
            }
        }

        async function testWasmExecution() {
            try {
                const module = await testWasmCompilation();
                if (!module) {
                    addResult('WASM Execution', false, 'No module to execute');
                    return false;
                }

                const instance = await WebAssembly.instantiate(module);

                const result1 = instance.exports.add(5, 7);
                const result2 = instance.exports.add(100, 200);
                const result3 = instance.exports.add(42, 8);

                if (result1 === 12 && result2 === 300 && result3 === 50) {
                    addResult('WASM Execution', true,
                        `✨ Code executed successfully!<br>
                        • add(5, 7) = ${result1}<br>
                        • add(100, 200) = ${result2}<br>
                        • add(42, 8) = ${result3}`);
                    return true;
                } else {
                    addResult('WASM Execution', false, 'Unexpected results');
                    return false;
                }
            } catch (error) {
                addResult('WASM Execution', false, error.message);
                return false;
            }
        }

        async function testWebSerial() {
            try {
                if ('serial' in navigator) {
                    addResult('Web Serial API', true,
                        '✅ Web Serial API supported (needed for flashing STM32)');

                    const methods = [];
                    if (navigator.serial.requestPort) methods.push('requestPort');
                    if (navigator.serial.getPorts) methods.push('getPorts');

                    addResult('Serial Methods', true,
                        `Available: ${methods.join(', ')}`);
                    return true;
                } else {
                    addResult('Web Serial API', false,
                        '⚠️ Web Serial not supported (Chrome/Edge required for flashing)');
                    return false;
                }
            } catch (error) {
                addResult('Web Serial API', false, error.message);
                return false;
            }
        }

        async function runAllTests() {
            results.innerHTML = '<h3 style="color: var(--accent-secondary);">Running tests...</h3>';

            await testWasmSupport();
            await new Promise(r => setTimeout(r, 300));

            await testWasmCompilation();
            await new Promise(r => setTimeout(r, 300));

            await testWasmExecution();
            await new Promise(r => setTimeout(r, 300));

            await testWebSerial();

            const div = document.createElement('div');
            div.className = 'test-result';
            div.style.borderLeft = '3px solid var(--accent-purple)';
            div.innerHTML = `
                <h3 style="color: var(--accent-purple); margin-bottom: 10px;">🎯 What This Means:</h3>
                <ul style="margin-left: 20px;">
                    <li><strong>WASM Support:</strong> Your browser can run compiled code</li>
                    <li><strong>WASM Compilation:</strong> We can build compilers that run in browser</li>
                    <li><strong>WASM Execution:</strong> Compiled code runs at near-native speed</li>
                    <li><strong>Web Serial:</strong> We can flash firmware directly to hardware</li>
                </ul>
                <p style="margin-top: 20px;">
                    <strong style="color: var(--accent-primary);">✅ Conclusion:</strong> Building a browser-based C compiler for STM32 is 100% feasible!
                </p>
            `;
            results.appendChild(div);
        }

        window.addEventListener('load', () => {
            setTimeout(runAllTests, 500);
        });
    </script>
</body>
</html>
